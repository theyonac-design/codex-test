<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>とわだ彩りパズル</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <h1>とわだ彩りパズル</h1>
        <p>
          自然・食・アートのピースをつないで、十和田市の魅力を集めよう！
        </p>
      </header>

      <main class="game-layout">
        <section class="panel title-panel" id="titlePanel">
          <h2>タイトル</h2>
          <p>
            落ちてくる2つ組ピースをそろえて、3つ以上つながると消える落ち物パズルです。
          </p>
          <ul>
            <li>← →：移動</li>
            <li>↑：回転　↓：高速落下</li>
            <li>Space：一時停止</li>
          </ul>
          <button id="startButton" class="primary">ゲーム開始</button>
        </section>

        <section class="panel play-panel">
          <div class="status-grid">
            <div class="status-item"><span>スコア</span><strong id="score">0</strong></div>
            <div class="status-item"><span>レベル</span><strong id="level">1</strong></div>
            <div class="status-item"><span>連鎖</span><strong id="chain">0</strong></div>
          </div>

          <div class="board-wrap">
            <canvas id="gameCanvas" width="320" height="560" aria-label="ゲーム盤面"></canvas>
            <div id="overlayMessage" class="overlay hidden"></div>
          </div>

          <div class="control-row">
            <button id="pauseButton">一時停止</button>
            <button id="restartButton">リスタート</button>
          </div>
        </section>

        <aside class="panel side-panel">
          <h2>次のピース</h2>
          <canvas id="nextCanvas" width="150" height="150"></canvas>

          <h3>十和田スポット案内</h3>
          <p id="spotMessage">まずはピースを消して観光情報を集めよう！</p>

          <h3>ピースのカテゴリ</h3>
          <ul class="legend" id="legend"></ul>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
